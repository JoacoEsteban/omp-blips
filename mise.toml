[tools]
bun = "latest"

[tasks.typecheck]
description = "Type-check the extension"
run = "bun run tsc --noEmit"

[tasks.lint]
description = "Lint the extension"
run = "bun run lint"

[tasks.lint-fix]
description = "Lint and fix the extension"
run = "bun run lint:fix"

[tasks.audition]
description = "Play the same phrase through every preset"
run = "bun run scripts/audition.ts"

[tasks.latency]
description = "Measure blip latency to the default output through the built-in mic"
run = "bun run scripts/latency.ts"

[tasks.test]
description = "Run the unit tests"
run = "bun test"

[tasks.link]
description = "Symlink this repo into the omp user extensions directory"
run = """
mkdir -p ~/.omp/agent/extensions
ln -sfn {{config_root}} ~/.omp/agent/extensions/omp-blips
echo "linked -> ~/.omp/agent/extensions/omp-blips"
"""

[tasks.unlink]
description = "Remove the omp extension symlink"
run = "rm -f ~/.omp/agent/extensions/omp-blips"

[tasks.release]
description = "Tag the version on main and push the tag, which publishes it to npm"
run = """
#!/usr/bin/env bash
set -euo pipefail
commit=$(jj log -r main --no-graph -T commit_id)
remote=$(jj log -r main@origin --no-graph -T commit_id)
if [ "$commit" != "$remote" ]; then echo "main is not pushed to origin" >&2; exit 1; fi
version=$(jj file show -r main package.json | jq -r .version)
git tag -a "v$version" -m "$version" "$commit"
git push origin "v$version"
"""
